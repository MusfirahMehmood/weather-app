<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather APP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app"><h1>🌤️ Weather APP</h1>
    <div class="search-row">
        <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
        <button id="searchBtn">Search</button>
    </div>
    <button id="locBtn">📍Use my current location</button>
    <div class="status" id="status"></div>
    <div class="spinner" id="spinner"></div>
    <div class="result" id="result">
        <div class="icon" id = "weatherIcon">☀️</div>
        <div class="city-name" id="cityName">--</div>
        <div class="condition" id="condition">--</div>
         <div class="temp" id="temp">--°C</div>
    <div class="details">
      <div class="detail-item">
        <div class="detail-label">Humidity</div>
        <div class="detail-value" id="humidity">--%</div>
        </div>
      <div class="detail-item">
        <div class="detail-label">Feels Like</div>
        <div class="detail-value" id="feelsLike">--°C</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Wind</div>
        <div class="detail-value" id="wind">-- km/h</div>
</div>
    </div>
    </div>
    </div>
    <script src="script.js"></script>
</body>
